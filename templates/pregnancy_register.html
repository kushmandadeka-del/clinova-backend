<!DOCTYPE html>
<html>
<head>
    <title>Register Pregnancy - Clinova</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pregnancy.css') }}">
</head>

<body>

<div class="page">

    <div class="topbar">
        <h1>Clinova</h1>
        <a href="/dashboard">Dashboard</a>
    </div>

    <div class="card">

        <h2>Register Pregnancy</h2>

        <p class="subtitle">
            Create a pregnancy care record linked to a doctor and hospital.
        </p>

        <form method="POST">

            <label>Patient</label>

            <select name="patient_id" required>
                <option value="">Select Patient</option>

                {% for patient in patients %}
                    <option value="{{ patient['id'] }}">
                        {{ patient['name'] }} - {{ patient['phone'] }}
                    </option>
                {% endfor %}

            </select>

            <label>Doctor</label>

            <select name="doctor_id" required>
                <option value="">Select Doctor</option>

                {% for doctor in doctors %}
                    <option value="{{ doctor['id'] }}">
                        Dr. {{ doctor['name'] }} - {{ doctor['specialization'] }}
                    </option>
                {% endfor %}

            </select>

            <label>Hospital</label>

            <select name="hospital_id" required>
                <option value="">Select Hospital</option>

                {% for hospital in hospitals %}
                    <option value="{{ hospital['id'] }}">
                        {{ hospital['name'] }}
                    </option>
                {% endfor %}

            </select>

            <label>Last Menstrual Period (LMP)</label>
            <input type="date" name="lmp_date" required>

            <label>Blood Group</label>
            <select name="blood_group">
                <option value="">Select</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Risk Status</label>
            <select name="risk_status">
                <option value="Normal">Normal</option>
                <option value="High Risk">High Risk</option>
                <option value="Critical">Critical</option>
            </select>

            <button type="submit">
                Create Pregnancy Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
