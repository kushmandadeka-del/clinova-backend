<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    </head>
    <body>
        <h2>Patient Dashboard</h2>

        <form method="GET">
            <input type="text" name="search" placeholder="Search by name" value="{{search}}">
            <button type="submit">Search</button>
        </form>

        <table border ="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
            {% for p in patients %}
            <tr>
                <td>{{ p['name'] }}</td>
                <td>{{ p['age'] }}</td>
                <td>{{ p['gender'] }}</td>
                <td>{{ p['phone'] }}</td>
                <td>
                <a href="/view_record/{{ p['id'] }}">View</a>
                <a href="/case_form/{{ p['id'] }}">Add Case Entry</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
