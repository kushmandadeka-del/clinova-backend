<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Hospital Referral - Clinova</title>
</head>

<body>

    <h1>🏥 Emergency Hospital Referral</h1>

    <p>
        Request an emergency referral to a suitable hospital.
    </p>

    <form method="POST">

        <label>Emergency Type</label>
        <br>

        <select name="emergency_type" required>
            <option value="">Select emergency type</option>
            <option value="Medical Emergency">Medical Emergency</option>
            <option value="Accident">Accident</option>
            <option value="Breathing Difficulty">Breathing Difficulty</option>
            <option value="Severe Pain">Severe Pain</option>
            <option value="Pregnancy Emergency">Pregnancy Emergency</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Required Facility</label>
        <br>

        <select name="required_facility" required>
            <option value="">Select required facility</option>
            <option value="Emergency Department">Emergency Department</option>
            <option value="ICU">ICU</option>
            <option value="NICU">NICU</option>
            <option value="Blood Bank">Blood Bank</option>
            <option value="Operation Theatre">Operation Theatre</option>
        </select>

        <br><br>

        <label>Emergency Level</label>
        <br>

        <select name="emergency_level" required>
            <option value="">Select emergency level</option>
            <option value="URGENT">Urgent</option>
            <option value="CRITICAL">Critical</option>
        </select>

        <br><br>

        <label>Additional Information</label>
        <br>

        <textarea
            name="description"
            rows="5"
            cols="40"
            placeholder="Describe the patient's condition or referral requirement..."
            required></textarea>

        <br><br>

        <button type="submit">
            🏥 Request Emergency Referral
        </button>

    </form>

    <br>

    <a href="{{ url_for('emergency') }}">
        ← Back to Emergency Care
    </a>

</body>

</html>
