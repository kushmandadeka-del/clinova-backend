<!DOCTYPE html>
<html>
    <head>
        <title>Register New Patient</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='patireg.css') }}">
    </head>
    <body>
        <h2>Register New Patient</h2>
        <form method="POST">
            <label>Full Name</label>
            <input type="text" name="name">
            <label>Age</label>
            <input type="number" name="age">
            <label>Gender</label>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Others</option>
            </select>
            <label>Phone number</label>
            <input type="text" name="phone">

            <label>ABHA ID (Optional)</label>
            <input type="text" name="abha_id" placeholder="Enter ABHA ID if available">
            <button type="submit">Register & Continue</button>
        </form>
    </body>
</html>
